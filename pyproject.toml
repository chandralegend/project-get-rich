[project]
name = "getrich"
version = "0.0.1"
description = "Local-first research and trading system (see ARCHITECTURE.md)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "rich>=13.7",
    "pytz",  # DuckDB needs it to return timezone-aware timestamps to Python
    "numpy>=2.0",
    "pandas>=2.2",
    "anthropic>=2.8.0",
    "claude-agent-sdk>=0.2.182",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]
ml = ["torch>=2.5", "lightgbm>=4.5"]

[project.scripts]
getrich = "getrich.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/getrich"]

[tool.uv]
default-groups = ["dev", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
