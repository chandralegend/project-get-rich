# The whole system in Docker: `docker compose up -d --build`, then open http://127.0.0.1:8420
#   api        the web UI and API (published on localhost only, there is no login)
#   scheduler  the jobs that launchd used to run: watchdog, paper tick, data refresh, news, Claude agents (never the trader, never orders)
# Both share one named volume holding the database, logs and state. A named volume (not a host folder) is used on purpose: the database
# lock needs real file locking, which bind mounts on macOS do not reliably give across containers.
# The API key and other secrets come from the gitignored .env; nothing secret is baked into the image.

x-getrich: &getrich
  image: getrich:local
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    GETRICH_HOME: /app
    GETRICH_DATA: /data
    GETRICH_NOTIFY: "0"
    GETRICH_TRADER_CLASSES: ${GETRICH_TRADER_CLASSES:-crypto}
    TZ: ${TZ:-Asia/Colombo}
  volumes:
    - getrich-data:/data
    - ./config:/app/config
    - ./docs:/app/docs:ro
    - ./research:/app/research:ro
  restart: unless-stopped

services:
  api:
    <<: *getrich
    container_name: getrich-api
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8420:8000"
  scheduler:
    <<: *getrich
    container_name: getrich-scheduler
    command: ["scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,datetime,sys; h=json.load(open('/data/state/scheduler.json'))['heartbeat']; age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(h.replace('Z','+00:00'))).total_seconds(); sys.exit(0 if age < 120 else 1)"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  models:
    # Daily live forecasts (Chronos-2, TimesFM 2.5, Kronos-small) for BTC and ETH. Its own image (torch lives only here), no network, no API keys, the
    # weights and the reviewed Kronos source read-only. It shares the data volume to read bars and write the forecast caches. Rebuild after code changes:
    # `docker compose build models`. First time: `scripts/models-weights` fills the weights volume and verifies it against the lock.
    image: getrich-models:local
    build:
      context: .
      dockerfile: docker/models.Dockerfile
    container_name: getrich-models
    network_mode: none
    command: ["scheduler", "--only", "models"]
    environment:
      GETRICH_HOME: /app
      GETRICH_DATA: /data
      GETRICH_NOTIFY: "0"
      TZ: ${TZ:-Asia/Colombo}
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - getrich-data:/data
      - getrich-models-hf:/hf:ro
      - ./config/forecast_models.lock.json:/app/config/forecast_models.lock.json:ro
      - ./models/kronos-src:/app/models/kronos-src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,datetime,sys; h=json.load(open('/data/state/scheduler-models.json'))['heartbeat']; age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(h.replace('Z','+00:00'))).total_seconds(); sys.exit(0 if age < 120 else 1)"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  getrich-data:
    name: getrich-data
  getrich-models-hf:
    name: getrich-models-hf
    external: true          # created and verified by scripts/models-weights
